<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenStudio3D · Sensor station (model-viewer)</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #666666; }
    /* Circular falloff: white in the centre (held for the first 35%), grey #666666 at the corners. */
    #stage { position: fixed; inset: 0;
      background: radial-gradient(circle farthest-corner at 50% 50%, #ffffff 0%, #ffffff 35%, #666666 100%); }
    model-viewer { width: 100%; height: 100%; background-color: transparent;
      --poster-color: transparent; --progress-bar-color: transparent; touch-action: none; }
    #status { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      color: #eee; font: 15px system-ui, sans-serif; background: rgba(0,0,0,.5);
      padding: 8px 14px; border-radius: 6px; pointer-events: none; }
    #debug { position: fixed; top: 12px; left: 12px; z-index: 10; padding: 10px 12px;
      background: rgba(0,0,0,.65); color: #eee; font: 12px/1.5 ui-monospace, monospace;
      border-radius: 6px; min-width: 220px; display: none; }
    #debug input[type=range] { width: 100%; }
  </style>
</head>
<body>
  <div id="stage">
    <!-- No camera-controls: the camera stays fixed in front of the model.
         The page rotates the model itself (model-viewer's scene pivot) from the input:
         mouse for development, the tangible controller (full 3D orientation) in use. -->
    <model-viewer id="mv"
      src="../../models/flower_03.glb"
      alt="3D model"
      environment-image="neutral"
      tone-mapping="neutral"
      shadow-intensity="0"
      field-of-view="30deg"
      camera-orbit="0deg 60deg 100%"
      interaction-prompt="none">
    </model-viewer>
  </div>
  <div id="status">Loading model…</div>
  <div id="debug">
    <div id="dbgText"></div>
    <label style="display:block;margin-top:6px">smoothing (SMOOTH) <span id="smoothVal"></span>
      <input id="smooth" type="range" min="0" max="30" step="1"></label>
    <div style="opacity:.6;margin-top:6px">D = hide · Z = zero controller</div>
  </div>

  <script type="module">
    import { attachMouseInput } from '../../shared/mouse-input.js?v=10';
    import { attachGamepadInput } from '../../shared/gamepad-input.js?v=3';
    import { qMul, qAxisAngle, qSlerp, qYawPitch } from '../../shared/quat.js?v=1';

    // --- settings ---
    const FRONT_YAW_DEG = 90;  // turns the model so its front looks at the screen at rest (90 = the figure's face; the flower is nearly symmetric)
    const params = new URLSearchParams(location.search);
    let SMOOTH = +(params.get('smooth') ?? 12);   // slerp toward the target: 1 - exp(-SMOOTH * dt); 0 = no smoothing
    const VIEW_ELEV_DEG = +(params.get('elev') ?? 30);   // camera this far above the model (degrees): you see it slightly from above
    const CONTROLLER_FRONT = +(params.get('front') ?? 90); // which board side faces you at Zero (90 = tested with the bare board, 21 Nov)

    const mv = document.getElementById('mv');
    const status = document.getElementById('status');
    if (params.get('model')) mv.src = params.get('model');

    // The model is rotated with a quaternion on model-viewer's internal scene pivot,
    // which turns it around its centre. This allows any orientation (full 360° in
    // every direction); the camera never moves.
    // Convention (same as the three.js version), screen axes x right, y up, z toward you:
    //   yaw +   = the model turns so its front moves to the right on screen
    //   pitch + = the front tilts up (you see more of the underside)
    const base = qAxisAngle(0, 1, 0, FRONT_YAW_DEG);
    let target = [0, 0, 0, 1], current = [0, 0, 0, 1];
    const station = {
      setTargetQuaternion(q) { target = q; },
      setTargetOrientation(yaw, pitch) {   // used by the mouse input
        target = qMul(qAxisAngle(1, 0, 0, -pitch), qAxisAngle(0, 1, 0, yaw));
      },
    };

    let pivotScene = null;
    function findScene() {
      const sym = Object.getOwnPropertySymbols(mv).find((s) => s.description === 'scene');
      const sc = sym && mv[sym];
      return sc && sc.scenePivot ? sc : null;
    }
    function applyRotation(q) {
      const r = qMul(q, base);
      pivotScene ??= findScene();
      if (pivotScene) {
        pivotScene.scenePivot.quaternion.set(r[0], r[1], r[2], r[3]);
        pivotScene.queueRender();
      } else {                              // fallback: camera orbit (yaw / pitch only)
        const { yaw, pitch } = qYawPitch(q);
        mv.cameraOrbit = `${-(yaw + FRONT_YAW_DEG)}deg ${Math.max(0, Math.min(180, 90 - VIEW_ELEV_DEG + pitch))}deg 100%`;
      }
    }

    // Mouse input (drag, arrow keys, 0 = reset) for development; works when no controller is plugged in.
    attachMouseInput(mv, station);

    // Game controller (firmware/tangible_controller): full orientation as a quaternion.
    // URL options: ?front=0|90|180|270 (which side of the board faces you at Zero, default 90),
    //              ?elev=30 (camera height above the model in degrees; 0 = exactly from the side)
    let modelLoaded = false, padConnected = false;
    const showHint = () => {
      if (!modelLoaded) return;
      status.style.display = 'block';
      status.textContent = padConnected ? 'Controller connected'
        : 'Press the button on the controller to start';
      if (padConnected) setTimeout(() => { if (padConnected) status.style.display = 'none'; }, 2000);
    };
    const pad = attachGamepadInput(station, {
      front: CONTROLLER_FRONT,
      axes: (params.get('qaxes') ?? '0,1,2').split(',').map(Number),
      onStatus: (s) => { padConnected = s === 'connected'; showHint(); },
    });
    window.addEventListener('keydown', (e) => { if (e.key === 'z' || e.key === 'Z') pad.zero(); });

    // --- loading messages ---
    mv.addEventListener('progress', (e) => {
      const p = e.detail.totalProgress;
      if (p < 1) status.textContent = `Loading model… ${Math.round(p * 100)}%`;
    });
    mv.cameraOrbit = `0deg ${90 - VIEW_ELEV_DEG}deg 100%`;
    mv.addEventListener('load', () => { modelLoaded = true; pivotScene = findScene(); showHint(); });
    mv.addEventListener('error', (e) => {
      status.textContent = 'Could not load the model.';
      console.error(e);
    });

    // --- debug overlay (D key or ?debug) ---
    const dbg = document.getElementById('debug');
    const smooth = document.getElementById('smooth');
    smooth.value = SMOOTH;
    smooth.oninput = () => { SMOOTH = +smooth.value; };
    if (params.has('debug')) dbg.style.display = 'block';
    window.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') dbg.style.display = dbg.style.display === 'none' ? 'block' : 'none';
    });

    // --- frame loop: smoothing + debug ---
    let frames = 0, lastFps = performance.now(), fps = 0, lastT = performance.now();
    (function loop(now) {
      const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
      const next = SMOOTH > 0 ? qSlerp(current, target, 1 - Math.exp(-SMOOTH * dt)) : target;
      if (Math.abs(next[0] - current[0]) + Math.abs(next[1] - current[1]) +
          Math.abs(next[2] - current[2]) + Math.abs(next[3] - current[3]) > 1e-6 || !pivotScene) {
        current = next;
        applyRotation(current);
      }
      frames++;
      if (now - lastFps > 500) { fps = frames * 1000 / (now - lastFps); frames = 0; lastFps = now; }
      if (dbg.style.display !== 'none') {
        const c = qYawPitch(current), t = qYawPitch(target);
        document.getElementById('dbgText').innerHTML =
          `yaw   ${c.yaw.toFixed(1).padStart(6)}°  (target ${t.yaw.toFixed(0)}°)<br>` +
          `pitch ${c.pitch.toFixed(1).padStart(6)}°  (target ${t.pitch.toFixed(0)}°)<br>` +
          `${fps.toFixed(0)} fps · ${pivotScene ? 'model rotation' : 'camera fallback'}<br>` +
          (pad.state.connected
            ? `controller: ${pad.state.id.slice(0, 28)}<br>` +
              `axes ${pad.state.axes.slice(0, 4).map((a) => a.toFixed(2)).join(' ')}<br>` +
              `button ${pad.state.button ? 'DOWN' : 'up'}`
            : 'controller: none (press its button)');
        document.getElementById('smoothVal').textContent = SMOOTH;
      }
      requestAnimationFrame(loop);
    })(performance.now());

    window.mv = mv; window.station = station;   // handy for testing in the console
  </script>
</body>
</html>
