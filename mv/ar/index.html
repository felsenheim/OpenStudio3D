<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenStudio3D · AR (model-viewer)</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #666666;
      font: 16px/1.4 system-ui, -apple-system, sans-serif; color: #222; }
    #stage { position: fixed; inset: 0;
      background: radial-gradient(circle farthest-corner at 50% 50%, #ffffff 0%, #ffffff 35%, #666666 100%); }
    model-viewer { width: 100%; height: 100%; background-color: transparent;
      --poster-color: transparent; --progress-bar-color: #2f4a6b; }
    #arButton { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%); border: 0; border-radius: 999px; padding: 14px 26px;
      background: #2f4a6b; color: #fff; font: 600 17px system-ui, -apple-system, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    #info { position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      width: min(90vw, 460px); text-align: center; background: rgba(255,255,255,.85);
      padding: 10px 14px; border-radius: 10px; font-size: 15px; }
    #info b { display: block; font-size: 17px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div id="stage">
    <!-- ar-scale="fixed": the model appears at its real size (1 unit in the GLB = 1 m; the flower is about 60 cm across).
         On iPhone/iPad model-viewer opens Apple AR Quick Look (it builds the USDZ from the GLB);
         on Android it uses WebXR or Google Scene Viewer. -->
    <model-viewer id="mv"
      src="../../models/flower_03.glb"
      alt="3D scan of a flower"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      ar-placement="floor"
      camera-controls
      disable-zoom
      disable-pan
      touch-action="pan-y"
      interaction-prompt="none"
      environment-image="neutral"
      tone-mapping="neutral"
      shadow-intensity="1"
      field-of-view="30deg"
      camera-orbit="0deg 70deg 100%">
      <button slot="ar-button" id="arButton">View in AR · real size</button>
    </model-viewer>
  </div>
  <div id="info"><b>Loading…</b></div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const mv = document.getElementById('mv');
    const info = document.getElementById('info');
    if (params.get('model')) mv.src = params.get('model');

    mv.addEventListener('progress', (e) => {
      const p = e.detail.totalProgress;
      if (p < 1) info.innerHTML = `<b>Loading… ${Math.round(p * 100)}%</b>`;
    });
    mv.addEventListener('load', () => {
      if (mv.canActivateAR) {
        info.innerHTML = '<b>Real size: about 60 cm across</b>Tap “View in AR”, point the phone at the floor or a table and step back about 1 m.';
      } else {
        info.innerHTML = '<b>AR needs a phone or tablet</b>Open this page on an iPhone, iPad or Android phone. Here you can turn the model with the mouse.';
        document.getElementById('arButton').style.display = 'none';
      }
    });
    mv.addEventListener('ar-status', (e) => {
      if (e.detail.status === 'failed') info.innerHTML = '<b>AR could not start</b>Check that the camera is allowed for this browser, then try again.';
    });
    mv.addEventListener('error', () => { info.innerHTML = '<b>Could not load the model.</b>'; });

    window.mv = mv;
  </script>
</body>
</html>
