<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tangible Interface</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #2a2a2a; color: #eee; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 520px; padding: 24px; }
    h1 { font-weight: 600; font-size: 26px; margin: 0 0 20px; }
    a.card { display: block; padding: 16px 18px; margin: 12px 0; border-radius: 10px;
      background: #383838; color: inherit; text-decoration: none; }
    a.card:hover { background: #444; }
    a.card b { display: block; font-size: 18px; }
    a.card span { color: #aaa; font-size: 14px; }
    .soon { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <h1>Tangible Interface</h1>
    <a class="card" href="sensor/">
      <b>Sensor station</b>
      <span>Turn the printed object in your hand; the model follows. (For now: drag with the mouse.)</span>
    </a>
    <a class="card" href="ar/">
      <b>AR station</b>
      <span>Point a phone or iPad at the printed card and walk around it.</span>
    </a>
    <p style="color:#aaa;font-size:14px">Card to print (A4, 100 %, matte): <a href="ar/card.pdf" style="color:#ddd">ar/card.pdf</a></p>
  </main>
</body>
</html>
