<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tangible Interface · AR station</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* own stacking context, so MindAR's video (z-index -2) stays inside it */
    #ar { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    #status { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 5; max-width: 86vw; text-align: center;
      color: #eee; font: 16px/1.4 system-ui, sans-serif; background: rgba(0,0,0,.6);
      padding: 10px 16px; border-radius: 8px; }
    #status button { margin-top: 8px; font: inherit; padding: 8px 16px; border-radius: 6px;
      border: 0; background: #eee; color: #111; }
    #status.hidden { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
      "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
    },
    "scopes": {
      "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/": {
        "three": "../shared/three-compat.js?v=1"
      }
    }
  }
  </script>
</head>
<body>
  <div id="ar"></div>
  <div id="status">Loading model…</div>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MindARThree } from 'mindar-image-three';
    import { Controller } from 'mindar-image';   // same class MindARThree uses (shared module)
    import { loadTangibleModel, modeForYaw, MODES } from '../shared/viewer.js?v=10';

    // ---- settings (URL options in brackets) ---------------------------------
    const params = new URLSearchParams(location.search);
    const num = (k, d) => (params.has(k) ? +params.get(k) : d);
    const FRONT_MM = 70;                   // distance of the "front" arrow tip from the card centre (mm)
    const TARGET_MM = 138;                 // width of target.png on paper (120 mm artwork + mode ring to 132 mm + 3 mm margin each side)
    const FILTER_MIN_CF = num('cf', 0.0005);   // MindAR one-euro filter: lower = calmer when still [?cf=]
    const FILTER_BETA = num('beta', 10);       // higher = less lag when moving [?beta=]
    // Our own pose smoothing on top of MindAR (same idea as the sensor station's SMOOTH):
    // All of these can also be changed live in the Tune panel (?debug).
    const tune = {
      dpos: num('dpos', 3),        // dead zone: ignore position changes smaller than this (mm)
      drot: num('drot', 1.5),      // dead zone: ignore rotation changes smaller than this (deg)
      smooth: num('smooth', 5),    // easing speed toward the tracked pose; 0 = off
      hyst: num('hyst', 3),        // degrees past a mode border before the mode switches
      height: num('height', 150),  // model height on the card (mm)
      xpower: num('xpower', 2.5),    // X-ray: rim width (higher = thinner)
      xint: num('xint', 2),        // X-ray: rim strength
      xbase: num('xbase', 0.05),   // X-ray: opacity of surfaces facing the viewer
      xcolor: '#' + (params.get('xcolor') || '2f4a6b').replace('#', ''),   // X-ray colour
      xadd: params.get('xadd') === '1',                                      // X-ray additive glow
      fov: num('fov', 66),         // camera field of view across the video's LONG side (deg). iPhone 16 main camera ≈ 63–67°.
                                   // MindAR's built-in assumption is 45° across the video height, which makes tall models lean.
    };
    const DEFAULTS = { dpos: 3, drot: 1.5, smooth: 5, hyst: 3, height: 150, fov: 66,
                       xpower: 2.5, xint: 2, xbase: 0.05, xcolor: '#2f4a6b', xadd: false };
    const DEG = 180 / Math.PI;

    const status = document.getElementById('status');
    const say = (html) => { status.innerHTML = html; status.classList.remove('hidden'); };
    const hide = () => status.classList.add('hidden');

    // ---- model ---------------------------------------------------------------
    let model;
    try {
      model = await loadTangibleModel(params.get('model') || '../models/head.glb', {
        frontYawDeg: 0,
        onProgress: (e) => { if (e.total) say(`Loading model… ${Math.round(e.loaded / e.total * 100)}%`); },
      });
    } catch (err) {
      console.error(err);
      say('Could not load the model: ' + err.message);
      throw err;
    }

    // Stand the model on the card. Anchor space: card centre = origin, card width = 1,
    // x right, y toward the top of the card, z up out of the card.
    // Model space: y up, front = +z.  Rx(+90°) maps model y -> card z (up) and the
    // model's front -> card -y, i.e. toward the "front" arrow at the bottom of the card.
    const box = new THREE.Box3().setFromObject(model.root);
    const height = box.max.y - box.min.y;
    const standing = new THREE.Group();
    standing.add(model.root);
    model.root.position.y = -box.min.y;                       // base on the card plane
    const placed = new THREE.Group();
    placed.rotation.x = Math.PI / 2;
    const setHeight = (mm) => placed.scale.setScalar((mm / TARGET_MM) / height); // real-world size
    setHeight(tune.height);
    const applyXray = () => model.setXray({ color: tune.xcolor, power: tune.xpower, intensity: tune.xint,
                                            base: tune.xbase, additive: tune.xadd });
    applyXray();
    placed.add(standing);

    // ---- MindAR --------------------------------------------------------------
    // MindAR hard-codes a 45° camera field of view. If the real camera sees more (phones
    // usually do), the card's tilt is misjudged and the model leans. This patch recomputes
    // the camera geometry from tune.fov just before the target is loaded (each start).
    const addTargets = Controller.prototype.addImageTargetsFromBuffer;
    Controller.prototype.addImageTargetsFromBuffer = function (buffer) {
      const longSide = Math.max(this.inputWidth, this.inputHeight);   // same in portrait and landscape
      const f = (longSide / 2) / Math.tan((tune.fov * Math.PI / 180) / 2);
      this.projectionTransform = [[f, 0, this.inputWidth / 2], [0, f, this.inputHeight / 2], [0, 0, 1]];
      this.projectionMatrix = this._glProjectionMatrix({
        projectionTransform: this.projectionTransform,
        width: this.inputWidth, height: this.inputHeight, near: 10, far: 100000,
      });
      return addTargets.call(this, buffer);
    };

    const mindar = new MindARThree({
      container: document.getElementById('ar'),
      imageTargetSrc: './target.mind',
      maxTrack: 1,
      uiLoading: 'no', uiScanning: 'no', uiError: 'no',   // own messages instead
      filterMinCF: FILTER_MIN_CF,
      filterBeta: FILTER_BETA,
    });
    const { renderer, scene, camera } = mindar;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.NeutralToneMapping;
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // MindAR writes the raw card pose into anchor.group.matrix. The model hangs on a
    // separate group that follows that pose with a dead zone + easing (see updatePose).
    const anchor = mindar.addAnchor(0);
    const card = new THREE.Group();
    card.visible = false;
    card.add(placed);
    scene.add(card);
    let found = false, snap = true;
    anchor.onTargetFound = () => { found = true; snap = true; hide(); };
    anchor.onTargetLost = () => { found = false; say('Point the camera at the round card.'); };

    // ---- viewing angle around the card -> shading mode --------------------------
    // Card angle: 0° = the "front" arrow (bottom edge of the card), increasing clockwise
    // seen from above, i.e. walking to your left. Same sense as yaw on the sensor station.
    const inv = new THREE.Matrix4();
    const cam = new THREE.Vector3();
    const view = { azimuth: 0, elevation: 90 };
    // ---- pose smoothing ---------------------------------------------------------
    const raw = { p: new THREE.Vector3(), q: new THREE.Quaternion(), s: new THREE.Vector3() };
    const held = { p: new THREE.Vector3(), q: new THREE.Quaternion() };   // last pose outside the dead zone
    const stats = { held: 0, frames: 0 };
    function updatePose(dt) {
      anchor.group.matrix.decompose(raw.p, raw.q, raw.s);
      const mm = raw.s.x / TARGET_MM;   // scene units per millimetre on the card
      if (snap) {
        held.p.copy(raw.p); held.q.copy(raw.q);
        card.position.copy(raw.p); card.quaternion.copy(raw.q); card.scale.copy(raw.s);
        snap = false;
        return;
      }
      // Dead zone: only accept a new pose once it differs enough from the held one.
      const moved = raw.p.distanceTo(held.p) / mm > tune.dpos || held.q.angleTo(raw.q) * DEG > tune.drot;
      if (moved) { held.p.copy(raw.p); held.q.copy(raw.q); } else stats.held++;
      stats.frames++;
      // Easing toward the held pose (frame-rate independent).
      const k = tune.smooth > 0 ? 1 - Math.exp(-tune.smooth * dt) : 1;
      card.position.lerp(held.p, k);
      card.quaternion.slerp(held.q, k);
      card.scale.copy(raw.s);
    }

    // Mode with hysteresis: switch only once the azimuth is tune.hyst degrees past a border.
    function modeWithHysteresis(az, current) {
      const m = modeForYaw(az);
      if (m === current || current < 0) return m;
      return modeForYaw(az - tune.hyst) === m && modeForYaw(az + tune.hyst) === m ? m : current;
    }

    function updateViewAngle() {
      card.updateMatrix();
      inv.copy(card.matrix).invert();
      cam.setFromMatrixPosition(camera.matrixWorld).applyMatrix4(inv);  // camera in card space
      view.azimuth = (Math.atan2(-cam.x, -cam.y) * DEG + 360) % 360;
      view.elevation = Math.atan2(cam.z, Math.hypot(cam.x, cam.y)) * DEG;
    }

    // ---- debug overlay + Tune panel (?debug) ------------------------------------
    let debugEl = null;
    if (params.has('debug')) {
      debugEl = document.createElement('div');
      debugEl.style.cssText = `position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:6;
        padding:8px 10px;background:rgba(0,0,0,.6);color:#eee;font:12px/1.5 ui-monospace,monospace;border-radius:6px`;
      document.body.appendChild(debugEl);

      const sliders = [
        ['dpos', 'Dead zone', 'mm', 0, 10, 0.5],
        ['drot', 'Dead zone', '°', 0, 5, 0.25],
        ['smooth', 'Smooth', '', 0, 30, 1],
        ['hyst', 'Mode hysteresis', '°', 0, 20, 1],
        ['height', 'Model height', 'mm', 40, 180, 5],
        ['fov', 'Camera FOV, long side (restarts camera)', '°', 40, 90, 1],
        ['xpower', 'X-ray rim width (power)', '', 0.5, 6, 0.1],
        ['xint', 'X-ray rim strength', '', 0, 3, 0.05],
        ['xbase', 'X-ray facing opacity', '', 0, 0.5, 0.01],
      ];
      const btn = document.createElement('button');
      btn.textContent = 'Tune';
      btn.style.cssText = `position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:7;
        font:600 16px system-ui,sans-serif;padding:10px 16px;border:0;border-radius:8px;background:#eee;color:#111`;
      const panel = document.createElement('div');
      panel.style.cssText = `position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;
        display:none;max-height:62vh;overflow-y:auto;padding:12px 14px;background:rgba(0,0,0,.75);color:#eee;font:15px/1.3 system-ui,sans-serif;border-radius:10px`;
      panel.innerHTML = sliders.map(([k, label, unit, min, max, step]) => `
        <label style="display:block;margin:6px 0">${label} <b data-v="${k}"></b> ${unit}
          <input data-k="${k}" type="range" min="${min}" max="${max}" step="${step}" style="width:100%;height:28px"></label>`).join('') + `
        <label style="display:block;margin:6px 0">X-ray colour <input data-c="xcolor" type="color" style="width:56px;height:30px;vertical-align:middle"> <b data-v="xcolor"></b></label>
        <label style="display:block;margin:6px 0"><input data-c="xadd" type="checkbox" style="width:22px;height:22px;vertical-align:middle"> X-ray additive glow</label>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button data-a="copy" style="flex:1;font:inherit;padding:10px;border:0;border-radius:6px">Copy link with these values</button>
          <button data-a="reset" style="font:inherit;padding:10px;border:0;border-radius:6px">Reset</button>
        </div>
        <div data-a="url" style="margin-top:6px;font:11px ui-monospace,monospace;word-break:break-all;opacity:.8"></div>`;
      document.body.append(btn, panel);
      btn.onclick = () => { panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; };

      const link = () => {
        const u = new URL(location.href);
        for (const [k] of sliders) u.searchParams.set(k, tune[k]);
        u.searchParams.set('xcolor', tune.xcolor.replace('#', ''));
        u.searchParams.set('xadd', tune.xadd ? '1' : '0');
        u.searchParams.set('debug', '');
        return u.toString().replace('debug=&', 'debug&').replace(/debug=$/, 'debug');
      };
      const show = () => {
        for (const [k] of sliders) {
          panel.querySelector(`[data-k="${k}"]`).value = tune[k];
          panel.querySelector(`[data-v="${k}"]`).textContent = tune[k];
        }
        panel.querySelector('[data-c="xcolor"]').value = tune.xcolor;
        panel.querySelector('[data-v="xcolor"]').textContent = tune.xcolor;
        panel.querySelector('[data-c="xadd"]').checked = tune.xadd;
        panel.querySelector('[data-a="url"]').textContent = link();
      };
      const onInput = (e) => {
        const c = e.target.dataset.c;
        if (c === 'xcolor') { tune.xcolor = e.target.value; applyXray(); show(); return; }
        if (c === 'xadd') { tune.xadd = e.target.checked; applyXray(); show(); return; }
        const k = e.target.dataset.k; if (!k) return;
        tune[k] = +e.target.value;
        if (k === 'height') setHeight(tune.height);
        if (k === 'fov') restartCamera();
        if (k.startsWith('x')) applyXray();
        show();
      };
      panel.addEventListener('input', onInput);
      panel.addEventListener('change', (e) => { if (e.target.dataset.c === 'xadd') onInput(e); });
      panel.querySelector('[data-a="copy"]').onclick = async (e) => {
        try { await navigator.clipboard.writeText(link()); e.target.textContent = 'Copied ✓'; }
        catch { e.target.textContent = 'Copy failed: select the link below'; }
        setTimeout(() => { e.target.textContent = 'Copy link with these values'; }, 2000);
      };
      panel.querySelector('[data-a="reset"]').onclick = () => {
        Object.assign(tune, DEFAULTS); restartCamera();
        setHeight(tune.height); applyXray(); show();
      };
      show();
      window.tune = tune;

      // Check pole: a red 100 mm stick standing on the "front" arrow. Stand a real pen
      // upright on the arrow; with the right FOV the two stay together from every side.
      const POLE_MM = 100;
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5 / TARGET_MM, 1.5 / TARGET_MM, POLE_MM / TARGET_MM, 12),
        new THREE.MeshBasicMaterial({ color: 0xff2020 }));
      pole.rotation.x = Math.PI / 2;
      pole.position.set(0, -(FRONT_MM / TARGET_MM), POLE_MM / 2 / TARGET_MM);
      card.add(pole);
    }
    let acc = 0, frames = 0, fps = 0, heldPct = 0;

    // Restart MindAR so a new camera FOV takes effect (debounced while dragging the slider).
    let restartTimer = null;
    function restartCamera() {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(async () => {
        found = false; card.visible = false;
        anchor.visible = false; anchor.group.visible = false;   // so MindAR reports "found" again
        say('Restarting camera…');
        try { mindar.stop(); } catch (e) { /* not running */ }
        await mindar.start();
        mindar.resize();
        say('Point the camera at the round card.');
      }, 600);
    }

    // ---- start ---------------------------------------------------------------
    async function start() {
      say('Starting camera…');
      try {
        await mindar.start();
        mindar.resize();   // apply the patched camera geometry to the three.js camera
      } catch (err) {
        console.error(err);
        say('No camera access.<br>Allow the camera for this site (Settings › Safari/Chrome › Camera), then reload.' +
            '<br><button onclick="location.reload()">Reload</button>');
        return;
      }
      say('Point the camera at the round card.');
      const timer = new THREE.Timer();
      renderer.setAnimationLoop((time) => {
        timer.update(time);
        const dt = Math.min(timer.getDelta(), 0.1);
        card.visible = found;
        if (found) {
          updatePose(dt);
          updateViewAngle();
          model.forcedMode = modeWithHysteresis(view.azimuth, model.forcedMode ?? -1);
        }
        model.update(dt);
        renderer.render(scene, camera);
        if (debugEl) {
          acc += dt; frames++;
          if (acc > 0.5) { fps = frames / acc; acc = 0; frames = 0; heldPct = stats.frames ? Math.round(100 * stats.held / stats.frames) : 0; stats.held = stats.frames = 0; }
          debugEl.innerHTML = `card ${found ? 'found' : 'not found'}<br>` +
            `azimuth ${view.azimuth.toFixed(1).padStart(6)}°<br>` +
            `elevation ${view.elevation.toFixed(1).padStart(4)}°<br>` +
            `mode ${model.mode}: ${MODES[model.mode]}<br>` +
            `held ${heldPct}% of frames (dead zone)<br>` +
            `${fps.toFixed(0)} fps`;
        }
      });
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      say('This browser has no camera access. Open the page over https in Safari or Chrome.');
    } else {
      start();
    }
    window.model = model; window.mindar = mindar; window.view = view; window.card = card; window.anchor = anchor; // for testing in the console
  </script>
</body>
</html>
